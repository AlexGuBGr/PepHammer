name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pytest
      - run: python -m pytest tests/python -v

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("testthat", "DBI", "RSQLite", "stringr", "matrixStats", "purrr"))'
      - run: Rscript tests/testthat.R
